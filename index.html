<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3초 기억 🧠</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#172019;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center}.wrap{width:min(94vw,560px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:20px}.login{background:none;border:1px solid #dfe5dc;border-radius:10px;padding:8px 12px;color:#667068}.card{background:#fff;border:1px solid #e3e8e0;border-radius:28px;padding:25px;box-shadow:0 22px 65px #17201910}.center{text-align:center}.eyebrow{font-size:12px;color:#6f8769;font-weight:900;letter-spacing:.06em}.title{font-size:38px;letter-spacing:-.06em;margin:8px 0}.desc{color:#7b837d;line-height:1.65;margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.stat{background:#f7f9f5;border-radius:15px;padding:12px}.stat span{font-size:11px;color:#8a918b}.stat b{display:block;font-size:20px;margin-top:2px}.board{min-height:330px;background:#f0f4ed;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(100%,390px)}.cell{aspect-ratio:1;border:0;border-radius:14px;background:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #1720190a;cursor:pointer}.position-cell{font-size:26px;color:#263329}.start,.mainbtn{margin-top:18px;width:100%;border:0;border-radius:13px;padding:14px;background:#263329;color:white;font-weight:850}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.choice{width:100%;border:1px solid #e1e6df;background:#fff;border-radius:12px;padding:16px;font-size:30px;min-height:68px}.choice:hover{background:#f5f8f3}.modebox{margin-top:22px;padding-top:20px;border-top:1px solid #e7ebe5}.modebox h3{margin:0 0 10px}.modes{display:grid;gap:9px}.mode{display:flex;justify-content:space-between;align-items:center;border:1px solid #e3e8e0;border-radius:14px;padding:14px}.mode small{display:block;color:#7d857e;margin-top:3px}.price{font-weight:900}.buy{background:#263329;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:800}.locked{color:#7c847e;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#263329;color:white;padding:12px 17px;border-radius:12px;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}@media(max-width:500px){.card{padding:18px}.board{min-height:290px}.grid{gap:7px}.cell{font-size:24px}.title{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🧠 3초 기억</div><button class="login" onclick="login()">로그인</button></div>
<div class="card">
<div id="home" class="center">
<div class="eyebrow">MEMORY GAME</div><h1 class="title">3초 동안 기억하세요.</h1>
<p class="desc">잠깐 보여주는 이모지를 기억하고<br>사라진 뒤 정답을 골라보세요.</p>
<div class="stats"><div class="stat"><span>최고 단계</span><b id="best">1</b></div><div class="stat"><span>최고 점수</span><b id="bestscore">0</b></div><div class="stat"><span>플레이</span><b id="plays">0</b></div></div><div style="margin:0 0 16px;padding:12px 15px;border-radius:14px;background:#f7f9f5;text-align:left;display:flex;justify-content:space-between;align-items:center"><span>🛡️ 부활권 <b id="reviveCount">1</b>개</span><button class="buy" onclick="buyRevive()">₩990 결제</button></div>
<button class="start" onclick="startGame()">게임 시작</button>
<div class="modebox"><h3>🎮 다른 게임</h3><div class="modes">
<div class="mode"><div><b>🧩 위치 기억</b><small>어떤 이모지가 어느 위치에 있었는지 기억하세요.</small></div><div><span class="locked">무료</span><br><button class="buy" onclick="startPositionGame()">플레이</button></div></div>
</div></div>
</div>

<div id="game" class="hidden">
<div class="center"><div class="eyebrow" id="phase">LEVEL 1</div><h2 class="title" id="levelTitle">기억하세요</h2><p class="desc" id="instruction">3초 동안 기억하세요.</p></div>
<div class="board"><div id="grid" class="grid"></div></div>
<div id="choices" class="choices hidden"></div>
<button class="mainbtn" onclick="backHome()">그만하기</button>
</div>

<div id="result" class="hidden center">
<div class="eyebrow">RESULT</div><h2 class="title">🧠 결과</h2><p class="desc" id="resultText"></p><div id="reviveArea"></div><button class="mainbtn" onclick="positionMode?startPositionGame():startGame()">다시 도전</button><button class="mainbtn" style="background:#e8f1e4;color:#52704b" onclick="backHome()">메인으로</button>
</div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
const emojis=['🍎','🍌','🍇','🍉','🍓','🍒','🥝','🍋','🥑','🍕','🍔','🍩','🚗','🚲','✈️','🐶','🐱','🐸','🦊','🐼','⭐','🌙','☀️','🌈','🎈','⚽','🎵','❤️','🍀','🌸'];
let level=1,seq=[],answer=null,score=0,answerTimer=null,answerDeadline=0,usedRevive=false,positionMode=false,positionAnswer=null,positionCells=[],revives=Number(localStorage.getItem('memoryRevives')||1),plays=Number(localStorage.getItem('memoryPlays')||0),best=Number(localStorage.getItem('memoryBest')||1),bestscore=Number(localStorage.getItem('memoryScore')||0);
document.getElementById('best').textContent=best;document.getElementById('bestscore').textContent=bestscore;document.getElementById('plays').textContent=plays;document.getElementById('reviveCount').textContent=revives;
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function startPositionGame(){
 positionMode=true; level=1; score=0; usedRevive=false;
 show('game'); nextPositionRound();
}
function nextPositionRound(){
 clearInterval(answerTimer);
 document.getElementById('phase').textContent='POSITION · LEVEL '+level;
 document.getElementById('levelTitle').textContent='위치를 기억하세요';
 document.getElementById('instruction').textContent='3초 동안 위치를 기억하세요.';
 const count=Math.min(3+level,9);
 const chosen=shuffle(emojis).slice(0,count);
 const grid=document.getElementById('grid'); grid.innerHTML='';
 positionCells=[];
 for(let i=0;i<25;i++){
   const d=document.createElement('button'); d.className='cell'; d.dataset.index=i; d.textContent='';
   grid.appendChild(d); positionCells.push(d);
 }
 const indices=shuffle([...Array(25).keys()]).slice(0,count);
 chosen.forEach((e,i)=>{positionCells[indices[i]].textContent=e;});
 positionAnswer={emoji:chosen[Math.floor(Math.random()*chosen.length)], index:null};
 positionAnswer.index=indices[chosen.indexOf(positionAnswer.emoji)];
 document.getElementById('choices').classList.add('hidden');
 setTimeout(()=>hidePositionMemory(),3000);
}
function hidePositionMemory(){
 clearInterval(answerTimer);
 document.getElementById('levelTitle').textContent='어디에 있었을까요?';
 document.getElementById('instruction').textContent=`${positionAnswer.emoji}가 있었던 위치를 3초 안에 선택하세요.`;
 const grid=document.getElementById('grid');
 grid.innerHTML='';
 for(let i=0;i<25;i++){
   const b=document.createElement('button');
   b.className='cell position-cell';
   b.textContent='?';
   b.dataset.index=i;
   b.onclick=()=>choosePosition(i);
   grid.appendChild(b);
 }
 document.getElementById('choices').classList.add('hidden');
 startAnswerTimer();
}
function choosePosition(index){
 clearInterval(answerTimer);
 if(index===positionAnswer.index){
   score+=level; level++;
   if(level>best){best=level;localStorage.setItem('memoryBest',best);document.getElementById('best').textContent=best;}
   if(score>bestscore){bestscore=score;localStorage.setItem('memoryScore',bestscore);document.getElementById('bestscore').textContent=bestscore;}
   toast('🎉 정답! 다음 단계');
   setTimeout(nextPositionRound,450);
 } else {
   endPositionGame(false);
 }
}
function endPositionGame(timeout=false){
 clearInterval(answerTimer);
 show('result');
 document.getElementById('resultText').innerHTML=timeout
 ? `⏰ <b>시간 초과!</b><br>3초 안에 위치를 선택하지 못했어요.<br><br>최고 단계 <b>Lv.${level}</b><br>이번 점수 <b>${score}점</b>`
 : `❌ <b>위치가 틀렸어요!</b><br><br>최고 단계 <b>Lv.${level}</b><br>이번 점수 <b>${score}점</b>`;
 const area=document.getElementById('reviveArea');
 if(!usedRevive && revives>0){
   area.innerHTML=`<div style="margin:18px 0;padding:18px;border-radius:16px;background:#f7f9f5">
   <div style="font-size:24px">🛡️</div><b>부활권을 사용하시겠어요?</b>
   <div style="font-size:13px;color:#7b837d;margin:7px 0 13px">현재 LEVEL ${level}에서 한 번 더 도전할 수 있어요.</div>
   <button class="mainbtn" style="margin-top:0" onclick="revivePosition()">부활하기 · 🛡️ 1개</button>
   </div>`;
 } else if(!usedRevive){
   area.innerHTML=`<div style="margin:18px 0;padding:18px;border-radius:16px;background:#f7f9f5">
   <div style="font-size:24px">🛡️</div><b>부활권이 없습니다.</b>
   <div style="font-size:13px;color:#7b837d;margin:7px 0 13px">부활권 1개를 ₩990에 구매할 수 있어요.</div>
   <button class="mainbtn" style="margin-top:0" onclick="buyRevive()">부활권 1개 · ₩990</button>
   </div>`;
 } else {
   area.innerHTML=`<div style="margin:18px 0;color:#7b837d;font-size:13px">이번 게임에서 부활권을 이미 사용했습니다.</div>`;
 }
}
function revivePosition(){
 if(revives<=0 || usedRevive) return;
 revives--; usedRevive=true; localStorage.setItem('memoryRevives',revives);
 document.getElementById('reviveCount').textContent=revives;
 show('game'); nextPositionRound();
}
function startGame(){positionMode=false;level=1;score=0;usedRevive=false;plays++;localStorage.setItem('memoryPlays',plays);document.getElementById('plays').textContent=plays;show('game');nextRound()}
function nextRound(){
 document.getElementById('phase').textContent='LEVEL '+level;
 document.getElementById('levelTitle').textContent='기억하세요';
 document.getElementById('instruction').textContent='3초 동안 기억하세요.';
 const count=Math.min(4+level,15);seq=shuffle(emojis).slice(0,count);answer=seq[Math.floor(Math.random()*seq.length)];
 const grid=document.getElementById('grid');grid.innerHTML='';
 const cells=[...seq];while(cells.length<25)cells.push('');
 shuffle(cells).forEach(e=>{let d=document.createElement('button');d.className='cell';d.textContent=e;grid.appendChild(d)});
 document.getElementById('choices').classList.add('hidden');
 setTimeout(()=>hideMemory(),3000);
}
function hideMemory(){
 document.getElementById('levelTitle').textContent='무엇이었을까요?';
 document.getElementById('instruction').textContent='방금 본 것 중 하나를 골라보세요.';
 document.querySelectorAll('.cell').forEach(c=>c.textContent='');
 const choices=document.getElementById('choices');choices.innerHTML='';
 const choiceCount = Math.min(4 + level - 1, 10);
 const distractors = shuffle(emojis.filter(e => !seq.includes(e))).slice(0, choiceCount - 1);
 const options = shuffle([answer, ...distractors]);
 options.forEach(e => {
   let b = document.createElement('button');
   b.className = 'choice';
   b.textContent = e;
   b.onclick = () => choose(e);
   choices.appendChild(b);
 });
 choices.classList.remove('hidden');
 startAnswerTimer();
}
function startAnswerTimer(){
 clearInterval(answerTimer);
 answerDeadline=performance.now()+3000;
 document.getElementById('instruction').textContent='3초 안에 선택하세요.';
 answerTimer=setInterval(()=>{
   const left=Math.max(0,(answerDeadline-performance.now())/1000);
   document.getElementById('instruction').textContent=`3초 안에 선택하세요. ${left.toFixed(1)}초`;
   if(left<=0){clearInterval(answerTimer);positionMode?endPositionGame(true):endGame(true);}
 },50);
}
function choose(e){
 clearInterval(answerTimer);
 if(e===answer){score+=level;level++;if(level>best){best=level;localStorage.setItem('memoryBest',best);document.getElementById('best').textContent=best}if(score>bestscore){bestscore=score;localStorage.setItem('memoryScore',bestscore);document.getElementById('bestscore').textContent=bestscore}toast('🎉 정답! 다음 단계');setTimeout(nextRound,450)}
 else endGame();
}
function endGame(timeout=false){
 clearInterval(answerTimer);
 show('result');
 const reason = timeout ? '⏰ 시간 초과!' : '❌ 틀렸어요!';
 document.getElementById('resultText').innerHTML =
 `${reason}<br><br>현재 <b>Lv.${level}</b>에서 종료되었습니다.<br>이번 점수 <b>${score}점</b>`;
 const area=document.getElementById('reviveArea');
 if(!usedRevive && revives>0){
   area.innerHTML=`<div style="margin:18px 0;padding:18px;border-radius:16px;background:#f7f9f5">
   <div style="font-size:24px">🛡️</div>
   <b>부활권을 사용하시겠어요?</b>
   <div style="font-size:13px;color:#7b837d;margin:7px 0 13px">현재 LEVEL ${level}에서 한 번 더 도전할 수 있어요.</div>
   <button class="mainbtn" style="margin-top:0" onclick="revive()">부활하기 · 🛡️ 1개</button>
   </div>`;
 } else if(!usedRevive){
   area.innerHTML=`<div style="margin:18px 0;padding:18px;border-radius:16px;background:#f7f9f5">
   <div style="font-size:24px">🛡️</div><b>부활권이 없습니다.</b>
   <div style="font-size:13px;color:#7b837d;margin:7px 0 13px">부활권 1개를 ₩990에 구매할 수 있어요.</div>
   <button class="mainbtn" style="margin-top:0" onclick="buyRevive()">부활권 1개 · ₩990</button>
   </div>`;
 } else {
   area.innerHTML=`<div style="margin:18px 0;color:#7b837d;font-size:13px">이번 게임에서 부활권을 이미 사용했습니다.</div>`;
 }
}
function revive(){
 if(revives<=0 || usedRevive) return;
 revives--; usedRevive=true; localStorage.setItem('memoryRevives',revives);
 document.getElementById('reviveCount').textContent=revives;
 show('game');
 document.getElementById('phase').textContent='LEVEL '+level;
 nextRound();
}
function buyRevive(){
 const area=document.getElementById('reviveArea');
 area.innerHTML=`<div style="margin:18px 0;padding:20px;border-radius:16px;background:#f7f9f5;border:1px solid #e3e8e0">
   <div style="font-size:25px">🛡️</div>
   <b style="font-size:18px">부활권 1개</b>
   <div style="font-size:24px;font-weight:900;margin:8px 0 14px">₩990</div>
   <div style="font-size:12px;color:#7b837d;line-height:1.6;margin-bottom:14px">
     실제 결제는 PG(예: 토스페이먼츠) 연결 후 진행됩니다.<br>
     현재는 결제 연동 준비 화면입니다.
   </div>
   <button class="mainbtn" style="margin-top:0" onclick="startRealPayment()">결제하기 · ₩990</button>
   <button class="mainbtn" style="margin-top:8px;background:#e8ece7;color:#526057" onclick="endGame(false)">닫기</button>
 </div>`;
}
function startRealPayment(){
 // 실제 결제 연동 전 안전하게 막아둔 상태.
 // 토스페이먼츠 등의 실제 clientKey + 서버 결제 승인(confirm) 연동 후 활성화합니다.
 toast('결제 PG 연결 후 실제 결제가 활성화됩니다.');
}
function show(id){['home','game','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function backHome(){positionMode=false;clearInterval(answerTimer);show('home')}
function login(){toast('로그인 기능은 실제 배포 단계에서 연결할 수 있어요.')}
function buy(mode){toast(`${mode} · ₩990 결제는 실제 PG 연결 단계에서 활성화됩니다.`)}
</script>
</body>
</html>
