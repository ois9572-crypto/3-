<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3초 기억 🧠</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#172019;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center}.wrap{width:min(94vw,560px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:20px}.login{background:none;border:1px solid #dfe5dc;border-radius:10px;padding:8px 12px;color:#667068}.card{background:#fff;border:1px solid #e3e8e0;border-radius:28px;padding:25px;box-shadow:0 22px 65px #17201910}.center{text-align:center}.eyebrow{font-size:12px;color:#6f8769;font-weight:900;letter-spacing:.06em}.title{font-size:38px;letter-spacing:-.06em;margin:8px 0}.desc{color:#7b837d;line-height:1.65;margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.stat{background:#f7f9f5;border-radius:15px;padding:12px}.stat span{font-size:11px;color:#8a918b}.stat b{display:block;font-size:20px;margin-top:2px}.board{min-height:330px;background:#f0f4ed;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(100%,390px)}.cell{aspect-ratio:1;border:0;border-radius:14px;background:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #1720190a}.start,.mainbtn{margin-top:18px;width:100%;border:0;border-radius:13px;padding:14px;background:#263329;color:white;font-weight:850}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.choice{width:100%;border:1px solid #e1e6df;background:#fff;border-radius:12px;padding:16px;font-size:30px;min-height:68px}.choice:hover{background:#f5f8f3}.modebox{margin-top:22px;padding-top:20px;border-top:1px solid #e7ebe5}.modebox h3{margin:0 0 10px}.modes{display:grid;gap:9px}.mode{display:flex;justify-content:space-between;align-items:center;border:1px solid #e3e8e0;border-radius:14px;padding:14px}.mode small{display:block;color:#7d857e;margin-top:3px}.price{font-weight:900}.buy{background:#263329;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:800}.locked{color:#7c847e;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#263329;color:white;padding:12px 17px;border-radius:12px;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}@media(max-width:500px){.card{padding:18px}.board{min-height:290px}.grid{gap:7px}.cell{font-size:24px}.title{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🧠 3초 기억</div><button class="login" onclick="login()">로그인</button></div>
<div class="card">
<div id="home" class="center">
<div class="eyebrow">MEMORY GAME</div><h1 class="title">3초 동안 기억하세요.</h1>
<p class="desc">잠깐 보여주는 이모지를 기억하고<br>사라진 뒤 정답을 골라보세요.</p>
<div class="stats"><div class="stat"><span>최고 단계</span><b id="best">1</b></div><div class="stat"><span>최고 점수</span><b id="bestscore">0</b></div><div class="stat"><span>플레이</span><b id="plays">0</b></div></div>
<button class="start" onclick="startGame()">게임 시작</button>
<div class="modebox"><h3>🔒 다른 모드</h3><div class="modes">
<div class="mode"><div><b>⚡ 스피드 기억</b><small>3초 → 2초 → 1초</small></div><div><span class="price">₩990</span><br><button class="buy" onclick="buy('스피드 기억')">구매</button></div></div>
<div class="mode"><div><b>🔢 순서 기억</b><small>등장 순서까지 기억</small></div><div><span class="price">₩990</span><br><button class="buy" onclick="buy('순서 기억')">구매</button></div></div>
<div class="mode"><div><b>🧩 위치 기억</b><small>어디에 있었는지 기억</small></div><div><span class="price">₩990</span><br><button class="buy" onclick="buy('위치 기억')">구매</button></div></div>
<div class="mode"><div><b>🔥 연속 기억</b><small>이전 문제까지 기억</small></div><div><span class="price">₩990</span><br><button class="buy" onclick="buy('연속 기억')">구매</button></div></div>
</div></div>
</div>

<div id="game" class="hidden">
<div class="center"><div class="eyebrow" id="phase">LEVEL 1</div><h2 class="title" id="levelTitle">기억하세요</h2><p class="desc" id="instruction">3초 동안 기억하세요.</p></div>
<div class="board"><div id="grid" class="grid"></div></div>
<div id="choices" class="choices hidden"></div>
<button class="mainbtn" onclick="backHome()">그만하기</button>
</div>

<div id="result" class="hidden center">
<div class="eyebrow">RESULT</div><h2 class="title">🧠 결과</h2><p class="desc" id="resultText"></p><button class="mainbtn" onclick="startGame()">다시 도전</button><button class="mainbtn" style="background:#e8f1e4;color:#52704b" onclick="backHome()">메인으로</button>
</div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
const emojis=['🍎','🍌','🍇','🍉','🍓','🍒','🥝','🍋','🥑','🍕','🍔','🍩','🚗','🚲','✈️','🐶','🐱','🐸','🦊','🐼','⭐','🌙','☀️','🌈','🎈','⚽','🎵','❤️','🍀','🌸'];
let level=1,seq=[],answer=null,score=0,answerTimer=null,answerDeadline=0,plays=Number(localStorage.getItem('memoryPlays')||0),best=Number(localStorage.getItem('memoryBest')||1),bestscore=Number(localStorage.getItem('memoryScore')||0);
document.getElementById('best').textContent=best;document.getElementById('bestscore').textContent=bestscore;document.getElementById('plays').textContent=plays;
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){level=1;score=0;plays++;localStorage.setItem('memoryPlays',plays);document.getElementById('plays').textContent=plays;show('game');nextRound()}
function nextRound(){
 document.getElementById('phase').textContent='LEVEL '+level;
 document.getElementById('levelTitle').textContent='기억하세요';
 document.getElementById('instruction').textContent='3초 동안 기억하세요.';
 const count=Math.min(4+level,15);seq=shuffle(emojis).slice(0,count);answer=seq[Math.floor(Math.random()*seq.length)];
 const grid=document.getElementById('grid');grid.innerHTML='';
 const cells=[...seq];while(cells.length<25)cells.push('');
 shuffle(cells).forEach(e=>{let d=document.createElement('button');d.className='cell';d.textContent=e;grid.appendChild(d)});
 document.getElementById('choices').classList.add('hidden');
 setTimeout(()=>hideMemory(),3000);
}
function hideMemory(){
 document.getElementById('levelTitle').textContent='무엇이었을까요?';
 document.getElementById('instruction').textContent='방금 본 것 중 하나를 골라보세요.';
 document.querySelectorAll('.cell').forEach(c=>c.textContent='');
 const choices=document.getElementById('choices');choices.innerHTML='';
 const choiceCount = Math.min(4 + level - 1, 10);
 const distractors = shuffle(emojis.filter(e => !seq.includes(e))).slice(0, choiceCount - 1);
 const options = shuffle([answer, ...distractors]);
 options.forEach(e => {
   let b = document.createElement('button');
   b.className = 'choice';
   b.textContent = e;
   b.onclick = () => choose(e);
   choices.appendChild(b);
 });
 choices.classList.remove('hidden');
 startAnswerTimer();
}
function startAnswerTimer(){
 clearInterval(answerTimer);
 answerDeadline=performance.now()+3000;
 document.getElementById('instruction').textContent='3초 안에 선택하세요.';
 answerTimer=setInterval(()=>{
   const left=Math.max(0,(answerDeadline-performance.now())/1000);
   document.getElementById('instruction').textContent=`3초 안에 선택하세요. ${left.toFixed(1)}초`;
   if(left<=0){clearInterval(answerTimer);endGame(true);}
 },50);
}
function choose(e){
 clearInterval(answerTimer);
 if(e===answer){score+=level;level++;if(level>best){best=level;localStorage.setItem('memoryBest',best);document.getElementById('best').textContent=best}if(score>bestscore){bestscore=score;localStorage.setItem('memoryScore',bestscore);document.getElementById('bestscore').textContent=bestscore}toast('🎉 정답! 다음 단계');setTimeout(nextRound,450)}
 else endGame();
}
function endGame(timeout=false){
 clearInterval(answerTimer);
 show('result');
 document.getElementById('resultText').innerHTML=timeout
 ? `⏰ <b>시간 초과!</b><br>3초 안에 선택하지 못했어요.<br><br>최고 단계 <b>Lv.${level}</b><br>이번 점수 <b>${score}점</b>`
 : `❌ 틀렸어요!<br><br>최고 단계 <b>Lv.${level}</b><br>이번 점수 <b>${score}점</b><br><br>${level>5?'상당히 잘했어요.':'한 번 더 도전해볼까요?'}`;
}
function show(id){['home','game','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function backHome(){show('home')}
function login(){toast('로그인 기능은 실제 배포 단계에서 연결할 수 있어요.')}
function buy(mode){toast(`${mode} · ₩990 결제는 실제 PG 연결 단계에서 활성화됩니다.`)}
</script>
</body>
</html>
